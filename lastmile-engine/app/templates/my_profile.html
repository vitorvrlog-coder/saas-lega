{% extends "base.html" %}
{% block title %}Meu perfil — Heimdall Logtech{% endblock %}
{% block content %}
<h2>Meu perfil</h2>

{% if success %}
<p style="color: var(--pico-ins-color)">Perfil atualizado com sucesso.</p>
{% endif %}
{% if error %}<p style="color: var(--pico-del-color)">{{ error }}</p>{% endif %}

<form method="post" action="/web/my-profile" style="max-width: 420px;">
    <label for="profile_email">E-mail</label>
    <input type="email" id="profile_email" value="{{ profile_user.email }}" disabled>

    <label for="name">Nome</label>
    <input type="text" id="name" name="name" value="{{ profile_user.name or '' }}" maxlength="255">

    <label for="phone">Telefone</label>
    <input type="tel" id="phone" name="phone" value="{{ profile_user.phone or '' }}" maxlength="30">

    <button type="submit">Salvar</button>
</form>
{% endblock %}
