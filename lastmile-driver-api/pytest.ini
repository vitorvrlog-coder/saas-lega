[pytest]
asyncio_mode = auto
; O engine assíncrono (app.db.session) é criado uma vez a nível de módulo e
; sua pool de conexões asyncpg fica presa ao event loop em que foi aberta —
; sem escopo de sessão aqui, cada teste rodaria num loop novo e as conexões
; de testes anteriores quebrariam ("Event loop is closed").
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
