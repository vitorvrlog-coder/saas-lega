{% extends "base.html" %}
{% block title %}Alterar senha — Heimdall Logtech{% endblock %}
{% block content %}
<h2>Alterar senha</h2>

{% if success %}
<p style="color: var(--pico-ins-color)">Senha alterada com sucesso.</p>
{% endif %}
{% if error %}<p style="color: var(--pico-del-color)">{{ error }}</p>{% endif %}

<form method="post" action="/web/change-password" style="max-width: 420px;">
    <label for="current_password">Senha atual</label>
    <input type="password" id="current_password" name="current_password" required>

    <label for="new_password">Nova senha</label>
    <input type="password" id="new_password" name="new_password" minlength="8" required>

    <label for="confirm_password">Confirme a nova senha</label>
    <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

    <button type="submit">Salvar nova senha</button>
</form>
{% endblock %}
