services:
  api:
    build:
      context: .
    container_name: heimdall-driver-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://lastmile_driver:${DRIVER_POSTGRES_PASSWORD}@heimdall-postgres:5432/lastmile_driver_app
      EVOLUTION_BASE_URL: http://heimdall-evolution-go:8080
      EVOLUTION_GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY}
      WEBHOOK_BASE_URL: http://heimdall-driver-api:8000
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:3b
      TESSERACT_CMD: /usr/bin/tesseract
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      SECRET_KEY: ${DRIVER_SECRET_KEY}
      INTERNAL_API_KEY: ${DRIVER_INTERNAL_API_KEY}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - opc_heimdall_net

networks:
  opc_heimdall_net:
    external: true
