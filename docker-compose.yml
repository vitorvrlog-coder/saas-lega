services:
  postgres:
    image: postgres:16
    container_name: heimdall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - heimdall_net

  evolution-go:
    image: evoapicloud/evolution-go:0.7.1
    container_name: heimdall-evolution-go
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      # Só loopback do host — pra ativar a licença via túnel SSH, sem
      # expor o manager pra internet.
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: heimdall
      GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY}
      POSTGRES_AUTH_DB: postgresql://heimdall:${POSTGRES_PASSWORD}@postgres:5432/whatsapp_saas?sslmode=disable
      POSTGRES_USERS_DB: postgresql://heimdall:${POSTGRES_PASSWORD}@postgres:5432/whatsapp_saas?sslmode=disable
      DATABASE_SAVE_MESSAGES: "true"
      WADEBUG: "false"
      LOGTYPE: "json"
      TZ: "America/Sao_Paulo"
      QRCODE_MAX_COUNT: 5
      CHECK_USER_EXISTS: "true"
    networks:
      - heimdall_net

  api:
    build:
      context: ./lastmile-engine
    container_name: heimdall-api
    restart: unless-stopped
    depends_on:
      - postgres
      - evolution-go
    ports:
      - "80:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://heimdall:${POSTGRES_PASSWORD}@postgres:5432/lastmile_engine
      EVOLUTION_BASE_URL: http://evolution-go:8080
      EVOLUTION_GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY}
      WEBHOOK_BASE_URL: http://heimdall-api:8000
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:3b
      GEOCODING_PROVIDER: nominatim
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - heimdall_net

networks:
  heimdall_net:

volumes:
  postgres_data:
